# Square Share Docs Worker: serves the Next.js static export from ../out and
# answers `Accept: text/markdown` with each page's .md version.
#
# Local:  pnpm build && pnpm worker:dev   (http://localhost:8787)
# Production: https://docs.squareshare.eu
#   SITE_URL=https://docs.squareshare.eu pnpm build
#   pnpm exec wrangler deploy --config worker/wrangler.toml
# The custom domain below is attached on deploy (or already attached in the
# dashboard). workers_dev is off so the site has one public address.

name = "sq-docs"
main = "index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "docs.squareshare.eu", custom_domain = true }]

[assets]
directory = "../out"
binding = "ASSETS"
# out/<lang>/404.html for missing pages under /en and /cs, out/404.html elsewhere.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# The Worker sees every request so it can negotiate Markdown and set caching.
run_worker_first = true

[dev]
port = 8787

# Preview for reading before launch: https://sq-docs-preview.squareshare.workers.dev
#   SITE_URL=https://sq-docs-preview.squareshare.workers.dev pnpm build
#   pnpm exec wrangler deploy --config worker/wrangler.toml --env preview
# NOINDEX makes the Worker send X-Robots-Tag: noindex on every response.
[env.preview]
name = "sq-docs-preview"
workers_dev = true
# Must stay empty: otherwise the preview inherits docs.squareshare.eu and takes it.
routes = []

[env.preview.vars]
NOINDEX = "1"
